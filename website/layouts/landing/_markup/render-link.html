{{- /* Plain link. Hextra's decorates external links with an inline SVG icon
       carrying `hx:` utility classes, which this page cannot style. */ -}}
{{- $external := hasPrefix .Destination "http" -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} target="_blank" rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
