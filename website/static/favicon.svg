<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="datagraph">
  <title>datagraph</title>
  <!-- The browser tab renders this at 16-20 px, so it carries the REDUCTION
       (see datagraph-mark-min.svg), never the full bracket.

       A favicon cannot see the app's own theme toggle, but it can see the
       system's — hence the media query. Without it the navy records vanish
       against a dark tab strip. -->
  <style>
    .record { fill: #1a2a36 }
    @media (prefers-color-scheme: dark) { .record { fill: #f0f5fc } }
  </style>
  <rect x="20" y="28" width="24" height="8" fill="#f65e5e"/>
  <g class="record">
    <rect x="6" y="25" width="14" height="14"/>
    <rect x="44" y="25" width="14" height="14"/>
  </g>
</svg>
