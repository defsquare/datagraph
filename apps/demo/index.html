<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-graph — defsquare</title>
    <!-- Les polices sont embarquées (`src/fonts.css`, importé par style.css) :
         aucune requête sortante au lancement, et la typographie est la même
         hors ligne. -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="/defsquare-short-dark-red.svg" />
  </head>
  <body>
    <!-- Le canvas occupe tout le viewport ; tout le chrome ci-dessous flotte
         au-dessus de lui en `position: fixed`.

         Ce fichier ne porte plus que la MISE EN PLACE — les conteneurs
         positionnés — et le contenu d'ASSEMBLAGE propre à la démo. Les
         primitives (boutons d'icône, recherche, menu, pastille, lien de statut)
         sont construites par les fabriques de @defsquare/data-graph-chrome,
         seule source partagée avec le catalogue du design system : les écrire
         ici en dur les rendrait inaccessibles à tout autre consommateur, ce qui
         est exactement ce qui avait fini par en faire recopier une copie. -->
    <div id="app"></div>

    <!-- Rempli par `chrome.ts` : grappe d'icônes, recherche dépliante, menu ⋮. -->
    <div id="toolbar"></div>

    <aside id="detail" hidden>
      <div class="detail-head">
        <h2>Détail du nœud</h2>
        <!-- La croix (`#detail-close`) est ajoutée ici par `chrome.ts`. -->
      </div>
      <p id="selection-empty">Sélectionnez un nœud pour voir son détail.</p>
      <!-- La pastille de type (`#selection-type`) est insérée ici par
           `detail-panel.ts`, juste après le message d'état vide. -->
      <p id="selection-label" hidden></p>
      <p id="selection-path" hidden></p>
      <dl id="selection-rows"></dl>
    </aside>

    <!-- Écran d'erreur de chargement (mode fichier) : la validation sémantique
         de la config n'a lieu qu'ici, côté TS — Rust n'a vérifié que la syntaxe
         JSON. Le message brut (anglais, ConfigError du cœur) est cité tel quel :
         c'est la déclaration que l'auteur de la config doit relire.

         `.float` est appliquée directement : c'est une classe qu'on POSE sur une
         surface, pas un composant qu'on construit — la partager par la feuille
         suffit. -->
    <div id="load-error" class="float" hidden>
      <h2>Impossible d'ouvrir le document</h2>
      <pre id="load-error-message"></pre>
    </div>

    <div id="statusbar">
      <span><strong id="stat-nodes">0</strong> nœuds</span>
      <span><strong id="stat-visible">0</strong> visibles</span>
      <!-- Le lien de diagnostics (`#stat-diagnostics`) est ajouté ici par
           `chrome.ts`. -->
    </div>

    <img id="logo" src="/defsquare-short-dark-red.svg" alt="defsquare" />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
