<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-graph demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="page">
      <div id="toolbar">
        <h1>data-graph</h1>
        <input type="search" id="search" placeholder="Search…" autocomplete="off" />
        <button id="prev-match" title="Previous match (Shift+Enter)">↑</button>
        <button id="next-match" title="Next match (Enter)">↓</button>
        <span id="match-counter"></span>
        <button id="toggle-dataset">Load big dataset (2000)</button>
      </div>
      <div id="layout">
        <div id="app"></div>
        <aside id="detail">
          <h2>Node detail</h2>
          <p id="selection-label">Click a node to see details.</p>
          <p id="selection-path"></p>
          <ul id="selection-rows"></ul>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
