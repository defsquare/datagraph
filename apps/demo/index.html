<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>datagraph — defsquare</title>
    <!-- Fonts are embedded (`src/fonts.css`, imported by style.css): no outgoing
         request at startup, and the same typography offline. -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="/defsquare-short-dark-red.svg" />
  </head>
  <body>
    <!-- The canvas fills the whole viewport; all the chrome below floats above
         it in `position: fixed`.

         This file now carries only the LAYOUT — the positioned containers — and
         the ASSEMBLY content specific to the demo. The primitives (icon buttons,
         search, menu, badge, status link) are built by the factories of
         @defsquare/datagraph-chrome, the single source shared with the design
         system catalogue: writing them inline here would put them out of reach
         of any other consumer, which is exactly what ended up getting a copy of
         them made. -->
    <div id="app"></div>

    <!-- Filled by `chrome.ts`: icon cluster, unfolding search bar, ⋮ menu. -->
    <div id="toolbar"></div>

    <aside id="detail" hidden>
      <div class="detail-head">
        <h2>Détail du nœud</h2>
        <!-- The close button (`#detail-close`) is appended here by `chrome.ts`. -->
      </div>
      <p id="selection-empty">Sélectionnez un nœud pour voir son détail.</p>
      <!-- The type badge (`#selection-type`) is inserted here by
           `detail-panel.ts`, right after the empty-state message. -->
      <p id="selection-label" hidden></p>
      <p id="selection-path" hidden></p>
      <dl id="selection-rows"></dl>
    </aside>

    <!-- Load error screen (file mode): semantic validation of the config only
         happens here, on the TS side — Rust checked JSON syntax and nothing
         else. The raw message (English, the core's ConfigError) is quoted
         verbatim: it names the declaration the config author has to revisit.

         `.float` is applied directly: it is a class you PUT on a surface, not a
         component you build — sharing it through the stylesheet is enough. -->
    <div id="load-error" class="float" hidden>
      <h2>Impossible d'ouvrir le document</h2>
      <pre id="load-error-message"></pre>
    </div>

    <div id="statusbar">
      <span><strong id="stat-nodes">0</strong> nœuds</span>
      <span><strong id="stat-visible">0</strong> visibles</span>
      <!-- The diagnostics link (`#stat-diagnostics`) is appended here by
           `chrome.ts`. -->
    </div>

    <img id="logo" src="/defsquare-short-dark-red.svg" alt="defsquare" />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
