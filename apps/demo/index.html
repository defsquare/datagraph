<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-graph demo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #page {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
      }
      #toolbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #e5e7eb;
        background: #ffffff;
        font-size: 13px;
      }
      #search {
        width: 220px;
        padding: 4px 8px;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
      }
      #toolbar button {
        font-size: 13px;
        padding: 4px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: #f9fafb;
        cursor: pointer;
      }
      #match-counter {
        min-width: 3.5em;
        color: #4b5563;
        font-family: monospace;
      }
      #toggle-dataset {
        margin-left: auto;
      }
      #layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #app {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: block;
      }
      #detail-panel {
        width: 280px;
        flex: none;
        overflow-y: auto;
        padding: 12px 16px;
        box-sizing: border-box;
        border-left: 1px solid #e5e7eb;
        background: #ffffff;
        font-size: 13px;
      }
      #detail-panel h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      #selection-label {
        font-weight: 600;
        margin: 0 0 4px;
      }
      #selection-path {
        margin: 0 0 12px;
        color: #4b5563;
        font-family: monospace;
        word-break: break-all;
      }
      #selection-rows {
        margin: 0;
        padding-left: 16px;
      }
      #selection-rows li {
        font-family: monospace;
        margin-bottom: 2px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="toolbar">
        <input type="search" id="search" placeholder="Search…" autocomplete="off" />
        <button id="prev-match" title="Previous match (Shift+Enter)">↑</button>
        <button id="next-match" title="Next match (Enter)">↓</button>
        <span id="match-counter"></span>
        <button id="toggle-dataset">Load big dataset (2000)</button>
      </div>
      <div id="layout">
        <div id="app"></div>
        <aside id="detail-panel">
          <h2>Node detail</h2>
          <p id="selection-label">Click a node to see details.</p>
          <p id="selection-path"></p>
          <ul id="selection-rows"></ul>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
