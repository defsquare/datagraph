[package]
name = "datagraph"
version = "0.1.0"
description = "Data graph explorer"
authors = ["defsquare"]
license = "MIT"
repository = "https://gitlab.com/defsquare/datagraph"
edition = "2021"
rust-version = "1.81"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "datagraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary is named after the command the user types — `datagraph`.
# `mainBinaryName` (tauri.conf.json) must stay aligned.
[[bin]]
name = "datagraph"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# QuickJS, with no feature enabled: neither `loader` nor `dyn-load`. The context
# must never resolve a module — the only JavaScript that enters it is ours,
# embedded via include_str! and frozen at compile time.
rquickjs = "0.9"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# AppKit, only to paint the Dock tile at runtime (see src/dock.rs). Both crates
# are already in Cargo.lock — tauri vendors them — so this pulls nothing new;
# it only makes the dependency ours and explicit. Feature-gated per class
# because objc2-app-kit compiles the whole framework otherwise.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
