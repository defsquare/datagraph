[package]
name = "data-graph"
version = "0.1.0"
description = "Explorateur de graphe de donnees"
authors = ["defsquare"]
license = "MIT"
repository = "https://github.com/defsquare/data-graph"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "data_graph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Le binaire s'appelle comme la commande que l'utilisateur tape — `datagraph` —
# et non comme le paquet. `mainBinaryName` (tauri.conf.json) doit rester aligné.
[[bin]]
name = "datagraph"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
