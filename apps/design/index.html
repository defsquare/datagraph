<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-graph — playground du design system</title>
    <link rel="icon" type="image/svg+xml" href="/defsquare-short-dark-red.svg" />
  </head>
  <body>
    <!-- Empty shell: `main.ts` builds the whole shell (topbar, nav, view area).
         Nothing is hardcoded here because the list of views is a TypeScript
         registry — an HTML index duplicating it could only fall out of sync.
         The stylesheet and the tokens are loaded by `main.ts` as well, so that
         the @font-face → tokens → style order is held in a single place. -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
