<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="datagraph">
  <title>datagraph</title>
  <!-- The 32 px and 16 px rasters are cut from THIS one, not from the full
       mark: at that size the bracket is a single grey pixel row and the icon
       turns to mud. Same ground, same colours, just the bracket's contents. -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#1a2a36"/>
  <g transform="translate(160 160) scale(11)">
    <rect x="20" y="28" width="24" height="8" fill="#f65e5e"/>
    <g fill="#f0f5fc">
      <rect x="6" y="25" width="14" height="14"/>
      <rect x="44" y="25" width="14" height="14"/>
    </g>
  </g>
</svg>
